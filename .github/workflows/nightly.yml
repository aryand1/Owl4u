name: Nightly re-scoring

on:
  schedule:
    - cron: "17 7 * * *"   # every day at 07:17 UTC
  workflow_dispatch:
    inputs:
      max_ontologies:
        description: "Most ontologies to score in this run"
        default: "60"
      only_acronyms:
        description: "Comma-separated acronyms to re-score even if unchanged (optional)"
        default: ""

concurrency:
  group: nightly-rescore
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: nightly/requirements.txt

      - name: Cache the BERT model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bert-base-uncased-v1

      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r nightly/requirements.txt

      - name: Re-score changed ontologies
        env:
          BIOPORTAL_API_KEY: ${{ secrets.BIOPORTAL_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          MAX_ONTOLOGIES: ${{ inputs.max_ontologies || '60' }}
          ONLY_ACRONYMS: ${{ inputs.only_acronyms || '' }}
        run: python nightly/nightly.py

      - name: Keep the run's outputs for 14 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ github.run_id }}
          path: |
            nightly_work/exports
            nightly_work/logs
          retention-days: 14
          if-no-files-found: ignore
